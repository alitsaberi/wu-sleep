[project]
name = "wu-sleep"
version = "0.1.0"
description = "Inference API for WU-Sleep, a domain-adapted sleep staging model for forehead wearable EEG."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ali Saberi", email = "ali.saberi96@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "somnio[signal,schemas,onnx]>=0.2.0b3",
]

[project.optional-dependencies]
examples = [
    "matplotlib>=3.10.9",
    "pyedflib>=0.1.42",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10"]
build-backend = "uv_build"
